<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Center large bead -->
  <circle cx="110" cy="110" r="22" fill="#4a7c59" opacity="0.9"/>
  <circle cx="110" cy="110" r="14" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.4"/>
  <circle cx="110" cy="110" r="4" fill="#fff" opacity="0.5"/>

  <!-- Top bead -->
  <circle cx="110" cy="72" r="13" fill="#6a9e7f" opacity="0.85"/>
  <circle cx="110" cy="72" r="5" fill="#fff" opacity="0.35"/>

  <!-- Bottom bead -->
  <circle cx="110" cy="148" r="13" fill="#6a9e7f" opacity="0.85"/>
  <circle cx="110" cy="148" r="5" fill="#fff" opacity="0.35"/>

  <!-- Left bead -->
  <circle cx="72" cy="110" r="13" fill="#3d6b4a" opacity="0.85"/>
  <circle cx="72" cy="110" r="5" fill="#fff" opacity="0.35"/>

  <!-- Right bead -->
  <circle cx="148" cy="110" r="13" fill="#3d6b4a" opacity="0.85"/>
  <circle cx="148" cy="110" r="5" fill="#fff" opacity="0.35"/>

  <!-- Diagonal small beads -->
  <circle cx="79" cy="79" r="8" fill="#c8a96e" opacity="0.8"/>
  <circle cx="141" cy="79" r="8" fill="#c8a96e" opacity="0.8"/>
  <circle cx="79" cy="141" r="8" fill="#c8a96e" opacity="0.8"/>
  <circle cx="141" cy="141" r="8" fill="#c8a96e" opacity="0.8"/>

  <!-- Thread lines -->
  <line x1="46" y1="110" x2="174" y2="110" stroke="#4a7c59" stroke-width="1.2" opacity="0.3"/>
  <line x1="110" y1="46" x2="110" y2="174" stroke="#4a7c59" stroke-width="1.2" opacity="0.3"/>
  <line x1="58" y1="58" x2="162" y2="162" stroke="#c8a96e" stroke-width="0.8" opacity="0.25"/>
  <line x1="162" y1="58" x2="58" y2="162" stroke="#c8a96e" stroke-width="0.8" opacity="0.25"/>

  <!-- Crochet hook -->
  <path d="M168 88 Q185 88 185 102 Q185 114 174 116" fill="none" stroke="#4a7c59" stroke-width="3" stroke-linecap="round"/>
  <line x1="168" y1="88" x2="168" y2="135" stroke="#4a7c59" stroke-width="3" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="210" y1="60" x2="210" y2="160" stroke="#e8e8e3" stroke-width="1"/>

  <!-- Main text only -->
  <text x="232" y="118" font-family="Georgia, serif" font-size="42" font-weight="400" letter-spacing="-0.5" fill="#1a1a1a">Inventory Manager</text>

  <!-- Underline -->
  <line x1="232" y1="135" x2="595" y2="135" stroke="#4a7c59" stroke-width="0.8" opacity="0.5"/>
</svg>
